services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: repaysignal-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres.woqsnnmgfglzgclrjcfa:supabase%40311124@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres
      - MODEL_CACHE_DIR=/app/models_cache
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHONPATH=/app
    volumes:
      - ./models_cache:/app/models_cache
      - ./backend:/app/backend
    networks:
      - repaysignal-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://152.67.175.191:8000
    container_name: repaysignal-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - repaysignal-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  repaysignal-network:
    driver: bridge

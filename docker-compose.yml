version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: repaysignal-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./repaysignal.db
      - MODEL_CACHE_DIR=/app/models_cache
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./models_cache:/app/models_cache
      - ./backend:/app/backend
    networks:
      - repaysignal-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repaysignal-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - repaysignal-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  repaysignal-network:
    driver: bridge
